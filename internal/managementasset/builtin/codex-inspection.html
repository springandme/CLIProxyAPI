<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CPA Codex 账号巡检</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101827;
      --panel: #171e2e;
      --panel-2: #1d2638;
      --line: #2b3952;
      --text: #eef2f8;
      --muted: #9aa7ba;
      --blue: #3b9cff;
      --green: #60d653;
      --orange: #f5ae3d;
      --red: #ee5f72;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #0f2b3d 0, var(--bg) 30rem);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 62px;
      padding: 0 24px;
      background: rgba(17, 24, 39, .86);
      border-bottom: 1px solid #202a3b;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    h1 { font-size: 18px; margin: 0; }
    main { max-width: 1420px; margin: 0 auto; padding: 24px; }
    .toolbar, .card {
      background: rgba(23, 30, 46, .94);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto auto auto;
      gap: 12px;
      align-items: end;
    }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 650; }
    input, select {
      width: 100%;
      min-height: 38px;
      background: #111827;
      color: var(--text);
      border: 1px solid #35445f;
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
    }
    button {
      min-height: 38px;
      border: 1px solid #3e4b65;
      border-radius: 6px;
      color: var(--text);
      background: #273246;
      padding: 8px 12px;
      font-weight: 750;
      cursor: pointer;
    }
    button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    button.danger { background: #3a202c; border-color: #704052; color: #ff9aaa; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .tabs { display: inline-flex; gap: 4px; padding: 4px; background: #20283a; border-radius: 8px; margin-bottom: 16px; }
    .tabs button { background: transparent; border-color: transparent; min-height: 34px; }
    .tabs button.active { background: #174474; border-color: #276eb0; color: #8fc8ff; }
    .grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
    .stat {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-height: 92px;
    }
    .stat b { display: block; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
    .stat strong { display: block; color: var(--blue); font-size: 30px; line-height: 1; }
    .stat span { color: var(--muted); font-size: 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #273246; text-align: left; vertical-align: top; font-size: 13px; }
    th { color: var(--muted); font-size: 12px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 8px; font-size: 12px; font-weight: 800; }
    .pill.keep, .pill.completed, .pill.success { background: rgba(96, 214, 83, .15); color: var(--green); }
    .pill.disable, .pill.reauth, .pill.warning { background: rgba(245, 174, 61, .15); color: var(--orange); }
    .pill.delete, .pill.failed, .pill.error { background: rgba(238, 95, 114, .15); color: var(--red); }
    .pill.enable, .pill.running { background: rgba(59, 156, 255, .15); color: var(--blue); }
    .muted { color: var(--muted); }
    .row-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .hidden { display: none !important; }
    .log { max-height: 300px; overflow: auto; background: #0c1320; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
    .log div { padding: 4px 0; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    @media (max-width: 900px) {
      .toolbar { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      main { padding: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Codex 账号巡检</h1>
    <span class="muted" id="statusText">未连接</span>
  </header>
  <main>
    <section class="toolbar">
      <label>Management Key
        <input id="keyInput" type="password" autocomplete="current-password" placeholder="Authorization Bearer token">
      </label>
      <button id="saveKeyBtn">保存 Key</button>
      <button id="refreshBtn">刷新</button>
      <button id="serverRunBtn" class="primary">立即服务端巡检</button>
    </section>

    <div class="tabs">
      <button data-tab="server" class="active">服务端巡检</button>
      <button data-tab="local">本机巡检</button>
      <button data-tab="config">配置</button>
    </div>

    <section id="serverTab">
      <div class="card">
        <div class="grid" id="summaryGrid"></div>
      </div>
      <div class="card">
        <h2>巡检结果</h2>
        <div id="serverResults"></div>
      </div>
      <div class="card">
        <h2>巡检历史</h2>
        <div id="runHistory"></div>
      </div>
      <div class="card">
        <h2>日志</h2>
        <div class="log" id="serverLogs"></div>
      </div>
    </section>

    <section id="localTab" class="hidden">
      <div class="card">
        <button id="localRunBtn" class="primary">开始本机巡检</button>
        <span class="muted" id="localStatus"></span>
      </div>
      <div class="card">
        <div class="grid" id="localSummary"></div>
        <div id="localResults"></div>
      </div>
    </section>

    <section id="configTab" class="hidden">
      <div class="card">
        <div class="grid">
          <label>定时启用
            <select id="cfgEnabled"><option value="false">关闭</option><option value="true">开启</option></select>
          </label>
          <label>触发模式
            <select id="cfgMode"><option value="interval">固定间隔</option><option value="time_points">指定时间点</option></select>
          </label>
          <label>间隔分钟
            <input id="cfgInterval" type="number" min="1" step="1">
          </label>
          <label>时间点
            <input id="cfgTimePoints" placeholder="09:00,18:30">
          </label>
          <label>阈值 %
            <input id="cfgThreshold" type="number" min="1" max="100" step="1">
          </label>
          <label>自动动作
            <select id="cfgAuto">
              <option value="none">none</option>
              <option value="enable">enable</option>
              <option value="disable">disable</option>
              <option value="delete">delete</option>
            </select>
          </label>
        </div>
        <p><button id="saveConfigBtn" class="primary">保存配置</button></p>
      </div>
    </section>
  </main>
  <script>
    const state = { key: localStorage.getItem('cpa-management-key') || '', currentRun: null, config: null };
    const $ = id => document.getElementById(id);
    $('keyInput').value = state.key;

    function headers() {
      const h = { 'Content-Type': 'application/json' };
      if (state.key) h.Authorization = `Bearer ${state.key}`;
      return h;
    }
    async function api(path, options = {}) {
      const res = await fetch(path, { ...options, headers: { ...headers(), ...(options.headers || {}) } });
      const text = await res.text();
      const data = text ? JSON.parse(text) : null;
      if (!res.ok) throw new Error(data?.error || data?.message || `${res.status} ${res.statusText}`);
      return data;
    }
    function setStatus(text) { $('statusText').textContent = text; }
    function actionPill(action) { return `<span class="pill ${action || 'keep'}">${action || 'keep'}</span>`; }
    function time(ms) { return ms ? new Date(ms).toLocaleString() : '-'; }
    function percent(v) { return typeof v === 'number' ? `${v.toFixed(0)}%` : '-'; }

    function summary(run, results, target) {
      const counts = { total: results.length, delete: 0, disable: 0, enable: 0, reauth: 0, keep: 0, quota: 0 };
      results.forEach(r => { counts[r.action] = (counts[r.action] || 0) + 1; if (r.isQuota) counts.quota++; });
      target.innerHTML = [
        ['巡检集合', run?.probeSetCount ?? counts.total, `抽样 ${run?.sampledCount ?? counts.total}`],
        ['建议删除', counts.delete, '需谨慎确认'],
        ['建议禁用', counts.disable, '达到阈值或异常'],
        ['建议启用', counts.enable, '可恢复使用'],
        ['需重登', counts.reauth, 'OAuth 失效'],
        ['保留', counts.keep, `quota ${counts.quota}`],
      ].map(([a,b,c]) => `<div class="stat"><b>${a}</b><strong>${b}</strong><span>${c}</span></div>`).join('');
    }
    function resultsTable(results, serverMode) {
      if (!results?.length) return '<p class="muted">暂无结果</p>';
      return `<table><thead><tr><th>认证文件</th><th>账号</th><th>状态</th><th>动作</th><th>额度</th><th>原因</th><th></th></tr></thead><tbody>${
        results.map(r => `<tr>
          <td>${r.fileName || '-'}</td>
          <td>${r.displayAccount || r.authIndex || '-'}</td>
          <td>${r.disabled ? '禁用' : '启用'} ${r.status || ''}</td>
          <td>${actionPill(r.action)} ${r.actionStatus ? actionPill(r.actionStatus) : ''}</td>
          <td>${percent(r.usedPercent)}</td>
          <td>${r.actionReason || r.error || '-'}</td>
          <td>${serverMode && ['delete','disable','enable'].includes(r.action) ? `<button data-action-id="${r.id}">执行</button>` : ''}</td>
        </tr>`).join('')
      }</tbody></table>`;
    }
    async function loadConfig() {
      state.config = await api('/v0/management/codex-inspection/config');
      $('cfgEnabled').value = String(!!state.config.enabled);
      $('cfgMode').value = state.config.schedule?.mode || 'interval';
      $('cfgInterval').value = state.config.schedule?.intervalMinutes || 60;
      $('cfgTimePoints').value = (state.config.schedule?.timePoints || []).join(',');
      $('cfgThreshold').value = state.config.usedPercentThreshold || 100;
      $('cfgAuto').value = state.config.autoActionMode || 'none';
    }
    async function loadRuns() {
      const runs = await api('/v0/management/codex-inspection/runs?limit=20');
      $('runHistory').innerHTML = resultsRunHistory(runs.items || []);
      if (runs.items?.length) await loadRun(runs.items[0].id);
    }
    function resultsRunHistory(runs) {
      if (!runs.length) return '<p class="muted">暂无历史</p>';
      return `<table><thead><tr><th>ID</th><th>状态</th><th>开始</th><th>触发</th><th>结果</th></tr></thead><tbody>${
        runs.map(r => `<tr data-run="${r.id}"><td>#${r.id}</td><td>${actionPill(r.status)}</td><td>${time(r.startedAtMs)}</td><td>${r.triggerType || '-'}</td><td>删 ${r.deleteCount} 禁 ${r.disableCount} 启 ${r.enableCount} 留 ${r.keepCount}</td></tr>`).join('')
      }</tbody></table>`;
    }
    async function loadRun(id) {
      const detail = await api(`/v0/management/codex-inspection/runs/${id}`);
      state.currentRun = detail;
      summary(detail.run, detail.results || [], $('summaryGrid'));
      $('serverResults').innerHTML = resultsTable(detail.results || [], true);
      $('serverLogs').innerHTML = (detail.logs || []).map(l => `<div>[${time(l.createdAtMs)}] ${l.level}: ${l.message}</div>`).join('') || '<div>暂无日志</div>';
      bindActionButtons();
    }
    function bindActionButtons() {
      document.querySelectorAll('[data-action-id]').forEach(btn => {
        btn.onclick = async () => {
          const id = Number(btn.dataset.actionId);
          btn.disabled = true;
          try {
            const result = await api(`/v0/management/codex-inspection/runs/${state.currentRun.run.id}/actions`, {
              method: 'POST',
              body: JSON.stringify({ resultIds: [id] }),
            });
            state.currentRun = result.detail;
            summary(result.detail.run, result.detail.results || [], $('summaryGrid'));
            $('serverResults').innerHTML = resultsTable(result.detail.results || [], true);
            bindActionButtons();
          } catch (e) { alert(e.message); } finally { btn.disabled = false; }
        };
      });
    }
    async function runServerInspection() {
      $('serverRunBtn').disabled = true;
      setStatus('服务端巡检运行中');
      try {
        const detail = await api('/v0/management/codex-inspection/run', { method: 'POST' });
        state.currentRun = detail;
        summary(detail.run, detail.results || [], $('summaryGrid'));
        $('serverResults').innerHTML = resultsTable(detail.results || [], true);
        $('serverLogs').innerHTML = (detail.logs || []).map(l => `<div>[${time(l.createdAtMs)}] ${l.level}: ${l.message}</div>`).join('');
        await loadRuns();
        setStatus('服务端巡检完成');
      } catch (e) { setStatus(e.message); alert(e.message); } finally { $('serverRunBtn').disabled = false; }
    }
    async function runLocalInspection() {
      $('localRunBtn').disabled = true;
      $('localStatus').textContent = '运行中';
      try {
        const filesPayload = await api('/v0/management/auth-files');
        const files = (filesPayload.files || []).filter(f => (f.provider || f.type) === 'codex');
        const results = [];
        const threshold = Number(state.config?.usedPercentThreshold || 100);
        for (const file of files) {
          const authIndex = file.auth_index || file.authIndex;
          const base = {
            id: results.length + 1,
            fileName: file.name || file.id || authIndex,
            displayAccount: file.account || file.email || file.label || file.name || authIndex,
            authIndex,
            disabled: !!file.disabled,
            status: file.status || '',
            action: 'keep',
            actionReason: '无需处理',
            isQuota: false,
          };
          if (!authIndex) {
            results.push({ ...base, error: '缺少 auth_index', actionReason: '缺少 auth_index，保留账号' });
            continue;
          }
          try {
            const resp = await api('/v0/management/api-call', {
              method: 'POST',
              body: JSON.stringify({
                authIndex,
                method: 'GET',
                url: 'https://chatgpt.com/backend-api/wham/usage',
                header: { Authorization: 'Bearer $TOKEN$', 'Content-Type': 'application/json' },
              }),
            });
            const bodyText = typeof resp.body === 'string' ? resp.body : JSON.stringify(resp.body || {});
            let body = {};
            try { body = JSON.parse(bodyText); } catch {}
            const used = Number(body?.rate_limit?.primary_window?.used_percent ?? body?.rate_limit?.secondary_window?.used_percent ?? NaN);
            const quota = resp.status_code === 402 || /quota|limit reached|payment_required/i.test(bodyText) || (!Number.isNaN(used) && used >= threshold);
            let action = 'keep';
            let reason = '无需处理';
            if ([401, 403].includes(resp.status_code)) { action = 'reauth'; reason = '认证失效，建议重新登录'; }
            else if (quota && !base.disabled) { action = 'disable'; reason = `额度达到阈值 ${threshold}%`; }
            else if (!quota && base.disabled && resp.status_code >= 200 && resp.status_code < 300) { action = 'enable'; reason = '账号已恢复，建议启用'; }
            results.push({ ...base, statusCode: resp.status_code, usedPercent: Number.isNaN(used) ? undefined : used, isQuota: quota, action, actionReason: reason });
          } catch (e) {
            results.push({ ...base, error: e.message, actionReason: '探测异常，保留账号' });
          }
        }
        summary({ probeSetCount: files.length, sampledCount: files.length }, results, $('localSummary'));
        $('localResults').innerHTML = resultsTable(results, false);
        $('localStatus').textContent = `完成：${results.length} 个账号`;
      } catch (e) { $('localStatus').textContent = e.message; alert(e.message); } finally { $('localRunBtn').disabled = false; }
    }
    async function saveConfig() {
      const cfg = {
        enabled: $('cfgEnabled').value === 'true',
        schedule: {
          mode: $('cfgMode').value,
          intervalMinutes: Number($('cfgInterval').value || 60),
          timePoints: $('cfgTimePoints').value.split(',').map(s => s.trim()).filter(Boolean),
        },
        targetType: 'codex',
        workers: state.config?.workers || 4,
        deleteWorkers: state.config?.deleteWorkers || 4,
        timeout: state.config?.timeout || 15000,
        retries: state.config?.retries || 0,
        userAgent: state.config?.userAgent || 'codex_cli_rs/0.76.0',
        usedPercentThreshold: Number($('cfgThreshold').value || 100),
        sampleSize: state.config?.sampleSize || 0,
        autoActionMode: $('cfgAuto').value,
      };
      state.config = await api('/v0/management/codex-inspection/config', { method: 'PUT', body: JSON.stringify(cfg) });
      alert('已保存');
    }

    document.querySelectorAll('.tabs button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        ['server','local','config'].forEach(tab => $(`${tab}Tab`).classList.toggle('hidden', tab !== btn.dataset.tab));
      };
    });
    $('saveKeyBtn').onclick = () => { state.key = $('keyInput').value.trim(); localStorage.setItem('cpa-management-key', state.key); setStatus('Key 已保存'); };
    $('refreshBtn').onclick = async () => { try { await loadConfig(); await loadRuns(); setStatus('已刷新'); } catch (e) { setStatus(e.message); } };
    $('serverRunBtn').onclick = runServerInspection;
    $('localRunBtn').onclick = runLocalInspection;
    $('saveConfigBtn').onclick = saveConfig;
    $('runHistory').onclick = e => { const row = e.target.closest('[data-run]'); if (row) loadRun(row.dataset.run); };

    (async () => {
      try { await loadConfig(); await loadRuns(); setStatus('已连接'); }
      catch (e) { setStatus(e.message); }
    })();
  </script>
</body>
</html>
